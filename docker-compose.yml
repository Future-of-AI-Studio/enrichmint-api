# Local development database. Port 5435 avoids clashing with sibling projects (hcai uses 5434).
services:
  db:
    image: postgres:17-alpine
    container_name: enrichmint-db
    environment:
      POSTGRES_USER: enrichmint
      POSTGRES_PASSWORD: enrichmint
      POSTGRES_DB: enrichmint
    ports:
      - '5435:5432'
    volumes:
      - enrichmint_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enrichmint']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enrichmint_db:
